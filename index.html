<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢字クイズ 〜5年夏 国語 第1〜6回〜</title>
<style>
  :root{
    --bg:#f5f3ee;
    --card:#ffffff;
    --ink:#2c2a26;
    --accent:#b5471b;
    --accent2:#2f6b4f;
    --muted:#8a8478;
    --border:#e3ded3;
    --wrong:#c0392b;
    --correct:#2f6b4f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Mincho ProN","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 16px 60px;
  }
  .wrap{
    width:100%;
    max-width:640px;
  }
  h1{
    font-size:1.4rem;
    text-align:center;
    margin:0 0 4px;
    letter-spacing:.02em;
  }
  .sub{
    text-align:center;
    color:var(--muted);
    font-size:.85rem;
    margin-bottom:24px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:24px 20px;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
    margin-bottom:16px;
  }
  .section-title{
    font-weight:700;
    font-size:1rem;
    margin:0 0 12px;
    color:var(--accent);
  }
  .options label{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 4px;
    border-bottom:1px solid var(--border);
    font-size:.95rem;
    cursor:pointer;
  }
  .options label:last-child{border-bottom:none;}
  .options input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);}
  .count-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top:16px;
    font-size:.9rem;
  }
  select, button{
    font-family:inherit;
    font-size:.95rem;
  }
  select{
    padding:8px 10px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#fff;
  }
  .toggle-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:10px;
    font-size:.9rem;
    color:var(--muted);
  }
  button{
    border:none;
    border-radius:10px;
    padding:14px 18px;
    cursor:pointer;
    font-weight:700;
    transition:opacity .15s ease, transform .1s ease;
  }
  button:active{transform:scale(.98);}
  .btn-primary{
    background:var(--accent);
    color:#fff;
    width:100%;
    font-size:1.05rem;
    margin-top:20px;
  }
  .btn-secondary{
    background:#eee7d9;
    color:var(--ink);
  }
  .btn-ghost{
    background:transparent;
    color:var(--accent);
    border:1px solid var(--accent);
  }
  #startScreen .warn{
    color:var(--muted);
    font-size:.8rem;
    margin-top:10px;
    text-align:center;
  }
  .hidden{display:none !important;}

  /* Quiz screen */
  .progress-wrap{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:.85rem;
    color:var(--muted);
    margin-bottom:10px;
  }
  .progress-bar{
    flex:1;
    height:6px;
    background:var(--border);
    border-radius:99px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    width:0%;
    transition:width .25s ease;
  }
  .badge{
    display:inline-block;
    font-size:.72rem;
    color:var(--accent2);
    background:#e7f0ea;
    border-radius:99px;
    padding:2px 10px;
    margin-bottom:14px;
  }
  .sentence{
    font-size:1.25rem;
    line-height:2.1;
    margin:6px 0 22px;
    word-break:keep-all;
  }
  .blank{
    display:inline-block;
    min-width:2.6em;
    border-bottom:2px solid var(--accent);
    color:var(--accent);
    font-weight:700;
    text-align:center;
    padding:0 4px;
  }
  .hint{
    font-size:.8rem;
    color:var(--muted);
    margin:-14px 0 18px;
  }
  .hint-toggle{
    display:inline-block;
    font-size:.8rem;
    color:var(--accent2);
    background:none;
    border:1px dashed var(--accent2);
    border-radius:99px;
    padding:5px 14px;
    margin:2px 0 16px;
    cursor:pointer;
  }
  .hint-box{
    display:none;
    font-size:.85rem;
    color:var(--accent2);
    background:#eef5f1;
    border-radius:8px;
    padding:10px 12px;
    margin:-8px 0 16px;
  }
  .hint-box.show{display:block;}
  .meaning-line{
    font-size:.85rem;
    color:var(--muted);
    margin-top:6px;
  }
  input#answerInput{
    width:100%;
    font-size:1.15rem;
    padding:12px 14px;
    border:2px solid var(--border);
    border-radius:10px;
    outline:none;
    text-align:center;
  }
  input#answerInput:focus{border-color:var(--accent);}
  .result-box{
    margin-top:14px;
    padding:12px 14px;
    border-radius:10px;
    font-size:.95rem;
    display:none;
  }
  .result-box.correct{
    background:#e7f3ec;
    color:var(--correct);
    display:block;
  }
  .result-box.wrong{
    background:#fbebe8;
    color:var(--wrong);
    display:block;
  }
  .actions{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  .actions button{flex:1;}

  /* Result screen */
  .score-big{
    text-align:center;
    font-size:2.4rem;
    font-weight:800;
    color:var(--accent);
    margin:6px 0 2px;
  }
  .score-sub{
    text-align:center;
    color:var(--muted);
    margin-bottom:20px;
    font-size:.9rem;
  }
  .review-item{
    padding:10px 0;
    border-bottom:1px solid var(--border);
    font-size:.92rem;
  }
  .review-item:last-child{border-bottom:none;}
  .review-item .rs{color:var(--muted);font-size:.85rem;}
  .review-item .ra{color:var(--correct);font-weight:700;}
  .review-item .ru{color:var(--wrong);text-decoration:line-through;margin-right:6px;}
  footer{
    text-align:center;
    color:var(--muted);
    font-size:.75rem;
    margin-top:30px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>漢字クイズ</h1>
  <div class="sub">5年夏 国語 第1〜6回（1〜3年生で学習した漢字・まちがいやすい送りがな）全140問</div>

  <!-- START SCREEN -->
  <div id="startScreen" class="card">
    <p class="section-title">出題範囲を選ぶ</p>
    <div class="options">
      <label><input type="checkbox" class="rangeChk" value="第1・2回" checked> 第1・2回 1〜3年生で学習した漢字①（40問）</label>
      <label><input type="checkbox" class="rangeChk" value="第3・4回" checked> 第3・4回 1〜3年生で学習した漢字②（40問）</label>
      <label><input type="checkbox" class="rangeChk" value="第5・6回" checked> 第5・6回 まちがいやすい送りがな（60問）</label>
    </div>

    <div class="count-row">
      <span>出題数</span>
      <select id="countSelect">
        <option value="all">選んだ範囲を全て</option>
        <option value="10">10問</option>
        <option value="20">20問</option>
        <option value="40">40問</option>
      </select>
    </div>
    <div class="toggle-row">
      <input type="checkbox" id="shuffleChk" checked>
      <label for="shuffleChk">問題の順番をシャッフルする</label>
    </div>

    <button class="btn-primary" id="startBtn">クイズを始める</button>
    <p class="warn">カタカナの部分を漢字に直して入力してください（送りがなが必要なものは送りがなも含めて解答します）。</p>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="quizScreen" class="card hidden">
    <div class="badge" id="qBadge"></div>
    <div class="progress-wrap">
      <span id="qCounter">1 / 10</span>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <span id="qScore">正解 0</span>
    </div>
    <div class="sentence" id="qSentence"></div>
    <button type="button" class="hint-toggle" id="hintToggle">意味のヒントを見る</button>
    <div class="hint-box" id="hintBox"></div>
    <input type="text" id="answerInput" placeholder="漢字で入力" autocomplete="off">
    <div class="result-box" id="resultBox"></div>
    <div class="actions">
      <button class="btn-secondary" id="skipBtn">わからない</button>
      <button class="btn-primary" id="submitBtn" style="margin-top:0;">答える</button>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="resultScreen" class="card hidden">
    <p class="section-title">結果</p>
    <div class="score-big" id="finalScore">0 / 0</div>
    <div class="score-sub" id="finalPct"></div>
    <div id="reviewList"></div>
    <div class="actions">
      <button class="btn-ghost" id="retryWrongBtn">間違えた問題だけ復習する</button>
      <button class="btn-primary" id="restartBtn" style="margin-top:0;">最初からやり直す</button>
    </div>
  </div>

  <footer>5年夏 国語（必修編 第1・2回〜第5・6回）より作成</footer>
</div>

<script>
// ---------------------------------------------------------------
// 問題データ（全140問）
// key: 文中でカタカナのまま出てくる箇所（空欄化する対象）
// answer: 正解の漢字（送りがなを含む場合あり）
// alts: 別解（あれば）
// ---------------------------------------------------------------
const QUESTIONS = [
// ===== 第1・2回 =====
{r:"第1・2回",no:1,s:"劇の演目は決まったので、配役などのイサイは今後の会議で検討する。",k:"イサイ",a:"委細",m:"詳しい事情、細かい事情"},
{r:"第1・2回",no:2,s:"これまでの貯金をくずして、子どもの学費をクメンする。",k:"クメン",a:"工面",m:"必要なお金や物をやりくりして何とか用意すること"},
{r:"第1・2回",no:3,s:"アジア各国を訪れ、現地の文化に対するチケンを広める。",k:"チケン",a:"知見",m:"実際に見聞きして得た知識"},
{r:"第1・2回",no:4,s:"家族の誰もが、皿を割ったのは弟のシワザだろうと思っている。",k:"シワザ",a:"仕業",m:"誰か(多くは良くないこと)がした行い"},
{r:"第1・2回",no:5,s:"翌日提出の宿題があることを思い出し、セッパ詰まって部活を休んだ。",k:"セッパ",a:"切羽",m:"切羽詰まる＝追い詰められてどうにもならなくなること"},
{r:"第1・2回",no:6,s:"彼はガンライ面倒見の良い人なので、手伝ってくれたことは不思議ではない。",k:"ガンライ",a:"元来",m:"もともと、生まれつき"},
{r:"第1・2回",no:7,s:"客船はキテキを鳴らしながら港に近づいた。",k:"キテキ",a:"汽笛",m:"汽車や船が鳴らす笛の音"},
{r:"第1・2回",no:8,s:"緊張すると、ヘイゼイの彼女からは考えられないほど声が小さくなる。",k:"ヘイゼイ",a:"平静",m:"落ち着いていて静かなこと"},
{r:"第1・2回",no:9,s:"古代ギリシャの哲学者タレスは「バンブツの根源は水である」と説いた。",k:"バンブツ",a:"万物",m:"この世に存在するすべてのもの"},
{r:"第1・2回",no:10,s:"内容も見ずに手紙を捨てたのはソウケイだったと反省している。",k:"ソウケイ",a:"早計",m:"早まった考え、軽率な判断"},
{r:"第1・2回",no:11,s:"家を出た途端に雨に降られ、デバナをくじかれた気分だ。",k:"デバナ",a:"出鼻",m:"物事を始めようとする出だし(出鼻をくじく＝出だしの勢いをそがれる)"},
{r:"第1・2回",no:12,s:"彼女からガテンのいく説明を聞くまでは帰れない。",k:"ガテン",a:"合点",m:"納得すること、理解して承知すること"},
{r:"第1・2回",no:13,s:"何気なく触れた陶器は百万円もするシロモノだった。",k:"シロモノ",a:"代物",m:"品物。驚きや皮肉を込めて「そのもの」を指すことも"},
{r:"第1・2回",no:14,s:"彼の発明は、科学の常識を変えるカッキ的なものだった。",k:"カッキ",a:"画期",m:"新しい時代を開くこと(画期的＝これまでになく新しい)"},
{r:"第1・2回",no:15,s:"彼女はとても上手にシャミセンを弾く。",k:"シャミセン",a:"三味線",m:"日本の伝統的な三本弦の楽器"},
{r:"第1・2回",no:16,s:"彼らはバンドを結成してすぐにトウカクを現し、一躍有名人になった。",k:"トウカク",a:"頭角",m:"才能や技量が人より目立って優れること(頭角を現す)"},
{r:"第1・2回",no:17,s:"恐ろしい光景を見て、全身にオカンが走った。",k:"オカン",a:"悪寒",m:"発熱などで感じるぞくぞくする寒気"},
{r:"第1・2回",no:18,s:"強盗団は、ハクチュウ堂々と宝石店に侵入した。",k:"ハクチュウ",a:"白昼",m:"真昼、日中"},
{r:"第1・2回",no:19,s:"自衛隊は、戦後にホッソクした組織である。",k:"ホッソク",a:"発足",m:"組織や活動が新しく始まること"},
{r:"第1・2回",no:20,s:"ナポレオンがタイトウするまでの歴史を学ぶ。",k:"タイトウ",a:"台頭",m:"勢力を増して表に出てくること"},
{r:"第1・2回",no:21,s:"彼のフウテイから、科学者なのだろうと推測する。",k:"フウテイ",a:"風体",m:"身なりや外見の様子"},
{r:"第1・2回",no:22,s:"体に異変がある場合には、フクヤクをやめるよう医師に言われた。",k:"フクヤク",a:"服薬",m:"薬を飲むこと"},
{r:"第1・2回",no:23,s:"二十年ぶりに故郷へ帰ると、セキジツの面影はなかった。",k:"セキジツ",a:"昔日",m:"昔、以前"},
{r:"第1・2回",no:24,s:"作品が完成した生徒から、サミダレ式に提出した。",k:"サミダレ",a:"五月雨",m:"陰暦五月頃の長雨。転じて、物事が断続的に少しずつ続くこと(五月雨式)"},
{r:"第1・2回",no:25,s:"宝くじに当選した人は、ノホウズにお金を使っている。",k:"ノホウズ",a:"野放図",m:"締まりがなく勝手気ままなこと"},
{r:"第1・2回",no:26,s:"深夜の公園はキミが悪く、思わず目を背けた。",k:"キミ",a:"気味",m:"なんとなく感じる様子(気味が悪い)"},
{r:"第1・2回",no:27,s:"ホームランを打った彼は、チームのタテヤクシャとなった。",k:"タテヤクシャ",a:"立役者",m:"中心となって活躍する人"},
{r:"第1・2回",no:28,s:"彼は昔からイジワルな性格で、周りを困らせていた。",k:"イジワル",a:"意地悪",m:"わざと人を困らせるような性格・行為"},
{r:"第1・2回",no:29,s:"旅行の行き先が決まったので、サッソク荷物を準備しよう。",k:"サッソク",a:"早速",m:"すぐに、ただちに"},
{r:"第1・2回",no:30,s:"海外に移住する友人を、コンジョウの別れのように見送った。",k:"コンジョウ",a:"今生",m:"この世に生きている間、現世(今生の別れ＝二度と会えないような別れ)"},
{r:"第1・2回",no:31,s:"卒業生のカドデを祝うために歌をうたう。",k:"カドデ",a:"門出",m:"新しい生活・人生の出発"},
{r:"第1・2回",no:32,s:"サクランボはメカタで売られる。",k:"メカタ",a:"目方",m:"重さ"},
{r:"第1・2回",no:33,s:"女王の姿からは、ケダカサや美しさを感じられる。",k:"ケダカサ",a:"気高さ",m:"上品で気品があり優れている様子"},
{r:"第1・2回",no:34,s:"手紙の返事が来るのを、一日センシュウの思いで待っている。",k:"センシュウ",a:"千秋",m:"非常に待ち遠しいこと(一日千秋)"},
{r:"第1・2回",no:35,s:"かつては、シュツジによって身分を決められていた。",k:"シュツジ",a:"出自",m:"生まれ、身分や家柄の出どころ"},
{r:"第1・2回",no:36,s:"反対の声もあったが、彼はゴウインに計画を進めた。",k:"ゴウイン",a:"強引",m:"無理に押し通すこと"},
{r:"第1・2回",no:37,s:"学校では騒がしい彼も、外ではセケンテイを気にしておとなしくなる。",k:"セケンテイ",a:"世間体",m:"世間の人からどう見られるかということ"},
{r:"第1・2回",no:38,s:"疲れを癒やすため、温泉に入った。彼はメイトウと言われる。",k:"メイトウ",a:"名湯",m:"有名で効能の良い温泉"},
{r:"第1・2回",no:39,s:"彼女はマジメな性格なので、周囲からの信頼も厚い。",k:"マジメ",a:"真面目",m:"誠実で熱心な様子"},
{r:"第1・2回",no:40,s:"寄せ木ザイクは、手先が器用でないと作ることができない。",k:"ザイク",a:"細工",m:"手先を使って物を作ること、技巧"},

// ===== 第3・4回 =====
{r:"第3・4回",no:1,s:"彼に悩みを相談したことで、アンウンがはれたように気が楽になった。",k:"アンウン",a:"暗雲",m:"悪いことが起こりそうな気配(暗雲が晴れる＝不安が解消する)"},
{r:"第3・4回",no:2,s:"電源がつかないだけで故障したと思うのは、アンチョクな発想だ。",k:"アンチョク",a:"安直",m:"手軽で安易なこと"},
{r:"第3・4回",no:3,s:"母は、話す相手によってコワイロが変わる。",k:"コワイロ",a:"声色",m:"声の調子、声の様子"},
{r:"第3・4回",no:4,s:"店員がとても丁寧なクチョウで話しかける。",k:"クチョウ",a:"口調",m:"話し方の調子"},
{r:"第3・4回",no:5,s:"このペンは使いガッテがいいので、長年愛用している。",k:"ガッテ",a:"勝手",m:"都合、使いやすさ(使い勝手)"},
{r:"第3・4回",no:6,s:"外に出たら、そのツド手を洗うべきだ。",k:"ツド",a:"都度",m:"その時ごとに、そのたびに"},
{r:"第3・4回",no:7,s:"この映画には、製作された頃のジセイが反映されている。",k:"ジセイ",a:"時世",m:"その時代、世の中の移り変わり"},
{r:"第3・4回",no:8,s:"亡くなった恩師のおツヤに参列する。",k:"ツヤ",a:"通夜",m:"葬儀の前夜に故人を偲んで過ごすこと"},
{r:"第3・4回",no:9,s:"この活火山は、頻繁にメイドウをくり返す。",k:"メイドウ",a:"鳴動",m:"大きな音を立てて揺れ動くこと"},
{r:"第3・4回",no:10,s:"オセロでは、角をとるのがジョウセキだ。",k:"ジョウセキ",a:"定石",m:"物事を行う上での決まったやり方(元は囲碁の用語)"},
{r:"第3・4回",no:11,s:"警察官が、事故の原因をキュウメイする。",k:"キュウメイ",a:"究明",m:"物事の真相を深く調べて明らかにすること"},
{r:"第3・4回",no:12,s:"誰かが背後から近づくケハイを感じ、振り返った。",k:"ケハイ",a:"気配",m:"なんとなく感じられる様子"},
{r:"第3・4回",no:13,s:"引っ越しの際に、家具をシンチョウする。",k:"シンチョウ",a:"新調",m:"新しく作ること、買いそろえること"},
{r:"第3・4回",no:14,s:"大会で優勝した彼らは、カイシンの笑みをうかべた。",k:"カイシン",a:"会心",m:"期待どおりにいって満足すること(会心の笑み)"},

// ---------------------------------------------------------------
// アプリロジック
// ---------------------------------------------------------------
let quizSet = [];
let idx = 0;
let correctCount = 0;
let wrongList = []; // {q, given}
let answered = false;

const startScreen = document.getElementById('startScreen');
const quizScreen = document.getElementById('quizScreen');
const resultScreen = document.getElementById('resultScreen');

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

document.getElementById('startBtn').addEventListener('click', () => {
  const ranges = Array.from(document.querySelectorAll('.rangeChk:checked')).map(c=>c.value);
  if(ranges.length===0){
    alert('出題範囲を1つ以上選んでください。');
    return;
  }
  let pool = QUESTIONS.filter(q => ranges.includes(q.r));
  if(document.getElementById('shuffleChk').checked){
    pool = shuffle(pool);
  }
  const countVal = document.getElementById('countSelect').value;
  if(countVal !== 'all'){
    pool = pool.slice(0, parseInt(countVal,10));
  }
  quizSet = pool;
  idx = 0;
  correctCount = 0;
  wrongList = [];
  startScreen.classList.add('hidden');
  resultScreen.classList.add('hidden');
  quizScreen.classList.remove('hidden');
  renderQuestion();
});

function renderQuestion(){
  answered = false;
  const q = quizSet[idx];
  document.getElementById('qBadge').textContent = q.r + '　問' + q.no;
  document.getElementById('qCounter').textContent = (idx+1) + ' / ' + quizSet.length;
  document.getElementById('qScore').textContent = '正解 ' + correctCount;
  document.getElementById('progressFill').style.width = Math.round((idx/quizSet.length)*100) + '%';

  const highlighted = q.s.replace(q.k, '<span class="blank">' + q.k + '</span>');
  document.getElementById('qSentence').innerHTML = highlighted;

  const hintBox = document.getElementById('hintBox');
  hintBox.textContent = '意味：' + (q.m || '');
  hintBox.classList.remove('show');
  document.getElementById('hintToggle').textContent = '意味のヒントを見る';

  const input = document.getElementById('answerInput');
  input.value = '';
  input.disabled = false;
  input.focus();

  const rb = document.getElementById('resultBox');
  rb.className = 'result-box';
  rb.textContent = '';

  document.getElementById('submitBtn').textContent = '答える';
}

document.getElementById('hintToggle').addEventListener('click', () => {
  const hintBox = document.getElementById('hintBox');
  const btn = document.getElementById('hintToggle');
  const showing = hintBox.classList.toggle('show');
  btn.textContent = showing ? '意味のヒントを隠す' : '意味のヒントを見る';
});

function normalize(str){
  return str.trim()
    .replace(/[ 　]/g,'')
    .normalize('NFKC');
}

function checkAnswer(){
  if(answered) { nextQuestion(); return; }
  const q = quizSet[idx];
  const input = document.getElementById('answerInput');
  const given = input.value;
  const norm = normalize(given);
  const accepted = [q.a].concat(q.alts||[]).map(normalize);
  const isCorrect = accepted.includes(norm) && norm.length>0;

  answered = true;
  input.disabled = true;

  const rb = document.getElementById('resultBox');
  const meaningLine = q.m ? ('<div class="meaning-line">意味：' + q.m + '</div>') : '';
  if(isCorrect){
    correctCount++;
    rb.className = 'result-box correct';
    rb.innerHTML = '○ 正解！「' + q.a + '」' + meaningLine;
  } else {
    wrongList.push({q:q, given: given || '（未回答）'});
    rb.className = 'result-box wrong';
    rb.innerHTML = '× 不正解。正解は「' + q.a + '」' + meaningLine;
  }
  document.getElementById('qScore').textContent = '正解 ' + correctCount;
  document.getElementById('submitBtn').textContent = (idx+1 < quizSet.length) ? '次の問題へ' : '結果を見る';
}

function skipQuestion(){
  if(answered){ nextQuestion(); return; }
  const q = quizSet[idx];
  wrongList.push({q:q, given:'（スキップ）'});
  answered = true;
  document.getElementById('answerInput').disabled = true;
  const rb = document.getElementById('resultBox');
  const meaningLine = q.m ? ('<div class="meaning-line">意味：' + q.m + '</div>') : '';
  rb.className = 'result-box wrong';
  rb.innerHTML = '正解は「' + q.a + '」' + meaningLine;
  document.getElementById('submitBtn').textContent = (idx+1 < quizSet.length) ? '次の問題へ' : '結果を見る';
}

function nextQuestion(){
  idx++;
  if(idx >= quizSet.length){
    showResult();
  } else {
    renderQuestion();
  }
}

document.getElementById('submitBtn').addEventListener('click', checkAnswer);
document.getElementById('skipBtn').addEventListener('click', skipQuestion);
document.getElementById('answerInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){
    e.preventDefault();
    checkAnswer();
  }
});

function showResult(){
  quizScreen.classList.add('hidden');
  resultScreen.classList.remove('hidden');
  document.getElementById('finalScore').textContent = correctCount + ' / ' + quizSet.length;
  const pct = quizSet.length ? Math.round(correctCount/quizSet.length*100) : 0;
  document.getElementById('finalPct').textContent = '正答率 ' + pct + '%';

  const list = document.getElementById('reviewList');
  if(wrongList.length===0){
    list.innerHTML = '<p style="text-align:center;color:var(--correct);font-weight:700;">全問正解です！お見事。</p>';
  } else {
    list.innerHTML = '<p class="section-title">間違えた問題（' + wrongList.length + '問）</p>' +
      wrongList.map(w => {
        const sentence = w.q.s.replace(w.q.k, '<span class="blank">'+w.q.k+'</span>');
        const meaningLine = w.q.m ? ('<div class="meaning-line">意味：' + w.q.m + '</div>') : '';
        return '<div class="review-item">' +
          '<div class="rs">' + w.q.r + ' 問' + w.q.no + '　' + sentence + '</div>' +
          '<div><span class="ru">' + (w.given || '未回答') + '</span><span class="ra">→ ' + w.q.a + '</span></div>' +
          meaningLine +
          '</div>';
      }).join('');
  }
}

document.getElementById('restartBtn').addEventListener('click', () => {
  resultScreen.classList.add('hidden');
  startScreen.classList.remove('hidden');
});

document.getElementById('retryWrongBtn').addEventListener('click', () => {
  if(wrongList.length===0){
    alert('間違えた問題はありません。');
    return;
  }
  quizSet = wrongList.map(w=>w.q);
  idx = 0;
  correctCount = 0;
  wrongList = [];
  resultScreen.classList.add('hidden');
  quizScreen.classList.remove('hidden');
  renderQuestion();
});
</script>
