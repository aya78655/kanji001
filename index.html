<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢字クイズ 〜5年夏 国語 第1〜6回〜</title>
<style>
  :root{
    --bg:#f5f3ee;
    --card:#ffffff;
    --ink:#2c2a26;
    --accent:#b5471b;
    --accent2:#2f6b4f;
    --muted:#8a8478;
    --border:#e3ded3;
    --wrong:#c0392b;
    --correct:#2f6b4f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Mincho ProN","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 16px 60px;
  }
  .wrap{
    width:100%;
    max-width:640px;
  }
  h1{
    font-size:1.4rem;
    text-align:center;
    margin:0 0 4px;
    letter-spacing:.02em;
  }
  .sub{
    text-align:center;
    color:var(--muted);
    font-size:.85rem;
    margin-bottom:24px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:24px 20px;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
    margin-bottom:16px;
  }
  .section-title{
    font-weight:700;
    font-size:1rem;
    margin:0 0 12px;
    color:var(--accent);
  }
  .options label{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 4px;
    border-bottom:1px solid var(--border);
    font-size:.95rem;
    cursor:pointer;
  }
  .options label:last-child{border-bottom:none;}
  .options input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);}
  .count-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top:16px;
    font-size:.9rem;
  }
  select, button{
    font-family:inherit;
    font-size:.95rem;
  }
  select{
    padding:8px 10px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#fff;
  }
  .toggle-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:10px;
    font-size:.9rem;
    color:var(--muted);
  }
  button{
    border:none;
    border-radius:10px;
    padding:14px 18px;
    cursor:pointer;
    font-weight:700;
    transition:opacity .15s ease, transform .1s ease;
  }
  button:active{transform:scale(.98);}
  .btn-primary{
    background:var(--accent);
    color:#fff;
    width:100%;
    font-size:1.05rem;
    margin-top:20px;
  }
  .btn-secondary{
    background:#eee7d9;
    color:var(--ink);
  }
  .btn-ghost{
    background:transparent;
    color:var(--accent);
    border:1px solid var(--accent);
  }
  #startScreen .warn{
    color:var(--muted);
    font-size:.8rem;
    margin-top:10px;
    text-align:center;
  }
  .hidden{display:none !important;}

  /* Quiz screen */
  .progress-wrap{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:.85rem;
    color:var(--muted);
    margin-bottom:10px;
  }
  .progress-bar{
    flex:1;
    height:6px;
    background:var(--border);
    border-radius:99px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    width:0%;
    transition:width .25s ease;
  }
  .badge{
    display:inline-block;
    font-size:.72rem;
    color:var(--accent2);
    background:#e7f0ea;
    border-radius:99px;
    padding:2px 10px;
    margin-bottom:14px;
  }
  .sentence{
    font-size:1.25rem;
    line-height:2.6;
    margin:6px 0 22px;
    word-break:keep-all;
  }
  .sentence rt{
    font-size:.5em;
    color:var(--muted);
    user-select:none;
  }
  .review-item .rs rt{
    font-size:.6em;
    color:var(--muted);
  }
  .blank{
    display:inline-block;
    min-width:2.6em;
    border-bottom:2px solid var(--accent);
    color:var(--accent);
    font-weight:700;
    text-align:center;
    padding:0 4px;
  }
  .hint{
    font-size:.8rem;
    color:var(--muted);
    margin:-14px 0 18px;
  }
  .hint-box{
    display:block;
    font-size:1.25rem;
    color:#000000;
    background:#eef5f1;
    border-radius:8px;
    padding:10px 12px;
    margin:-10px 0 16px;
  }
  .meaning-line{
    font-size:.85rem;
    color:var(--muted);
    margin-top:6px;
  }
  input#answerInput{
    width:100%;
    font-size:1.15rem;
    padding:12px 14px;
    border:2px solid var(--border);
    border-radius:10px;
    outline:none;
    text-align:center;
  }
  input#answerInput:focus{border-color:var(--accent);}
  .result-box{
    margin-top:14px;
    padding:12px 14px;
    border-radius:10px;
    font-size:.95rem;
    display:none;
  }
  .result-box.correct{
    background:#e7f3ec;
    color:var(--correct);
    display:block;
  }
  .result-box.wrong{
    background:#fbebe8;
    color:var(--wrong);
    display:block;
  }
  .actions{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  .actions button{flex:1;}

  /* Result screen */
  .score-big{
    text-align:center;
    font-size:2.4rem;
    font-weight:800;
    color:var(--accent);
    margin:6px 0 2px;
  }
  .score-sub{
    text-align:center;
    color:var(--muted);
    margin-bottom:20px;
    font-size:.9rem;
  }
  .review-item{
    padding:10px 0;
    border-bottom:1px solid var(--border);
    font-size:.92rem;
  }
  .review-item:last-child{border-bottom:none;}
  .review-item .rs{color:var(--muted);font-size:.85rem;}
  .review-item .ra{color:var(--correct);font-weight:700;}
  .review-item .ru{color:var(--wrong);text-decoration:line-through;margin-right:6px;}
  footer{
    text-align:center;
    color:var(--muted);
    font-size:.75rem;
    margin-top:30px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>漢字クイズ</h1>
  <div class="sub">5年夏 国語 第1〜6回（1〜3年生で学習した漢字・まちがいやすい送りがな）全140問</div>

  <!-- START SCREEN -->
  <div id="startScreen" class="card">
    <p class="section-title">出題範囲を選ぶ</p>
    <div class="options">
      <label><input type="checkbox" class="rangeChk" value="第1・2回" checked> 第1・2回 1〜3年生で学習した漢字①（40問）</label>
      <label><input type="checkbox" class="rangeChk" value="第3・4回" checked> 第3・4回 1〜3年生で学習した漢字②（40問）</label>
      <label><input type="checkbox" class="rangeChk" value="第5・6回" checked> 第5・6回 まちがいやすい送りがな（60問）</label>
    </div>

    <div class="count-row">
      <span>出題数</span>
      <select id="countSelect">
        <option value="all">選んだ範囲を全て</option>
        <option value="10">10問</option>
        <option value="20">20問</option>
        <option value="40">40問</option>
      </select>
    </div>
    <div class="toggle-row">
      <input type="checkbox" id="shuffleChk" checked>
      <label for="shuffleChk">問題の順番をシャッフルする</label>
    </div>

    <button class="btn-primary" id="startBtn">クイズを始める</button>
    <p class="warn">カタカナの部分を漢字に直して入力してください（送りがなが必要なものは送りがなも含めて解答します）。</p>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="quizScreen" class="card hidden">
    <div class="badge" id="qBadge"></div>
    <div class="progress-wrap">
      <span id="qCounter">1 / 10</span>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <span id="qScore">正解 0</span>
    </div>
    <div class="sentence" id="qSentence"></div>
    <div class="hint-box" id="hintBox"></div>
    <input type="text" id="answerInput" placeholder="漢字で入力" autocomplete="off">
    <div class="result-box" id="resultBox"></div>
    <div class="actions">
      <button class="btn-secondary" id="skipBtn">わからない</button>
      <button class="btn-primary" id="submitBtn" style="margin-top:0;">答える</button>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="resultScreen" class="card hidden">
    <p class="section-title">結果</p>
    <div class="score-big" id="finalScore">0 / 0</div>
    <div class="score-sub" id="finalPct"></div>
    <div id="reviewList"></div>
    <div class="actions">
      <button class="btn-ghost" id="retryWrongBtn">間違えた問題だけ復習する</button>
      <button class="btn-primary" id="restartBtn" style="margin-top:0;">最初からやり直す</button>
    </div>
  </div>

  <footer>5年夏 国語（必修編 第1・2回〜第5・6回）より作成</footer>
</div>

<script>
// ---------------------------------------------------------------
// 問題データ（全140問）
// key: 文中でカタカナのまま出てくる箇所（空欄化する対象）
// answer: 正解の漢字（送りがなを含む場合あり）
// alts: 別解（あれば）
// ---------------------------------------------------------------
const QUESTIONS = [
// ===== 第1・2回 =====
{r:"第1・2回",no:1,s:"劇の演目は決まったので、配役などのイサイは今後の会議で検討する。",sf:"<ruby>劇<rt>げき</rt></ruby>の<ruby>演目<rt>えんもく</rt></ruby>は<ruby>決ま<rt>きま</rt></ruby>ったので、<ruby>配役<rt>はいやく</rt></ruby>などのイサイは<ruby>今後<rt>こんご</rt></ruby>の<ruby>会議<rt>かいぎ</rt></ruby>で<ruby>検討す<rt>けんとうす</rt></ruby>る。",k:"イサイ",a:"委細",m:"詳しい事情、細かい事情"},
{r:"第1・2回",no:2,s:"これまでの貯金をくずして、子どもの学費をクメンする。",sf:"これまでの<ruby>貯金<rt>ちょきん</rt></ruby>をくずして、<ruby>子ども<rt>こども</rt></ruby>の<ruby>学費<rt>がくひ</rt></ruby>をクメンする。",k:"クメン",a:"工面",m:"必要なお金や物をやりくりして何とか用意すること"},
{r:"第1・2回",no:3,s:"アジア各国を訪れ、現地の文化に対するチケンを広める。",sf:"アジア<ruby>各国<rt>かっこく</rt></ruby>を<ruby>訪れ<rt>おとずれ</rt></ruby>、<ruby>現地<rt>げんち</rt></ruby>の<ruby>文化<rt>ぶんか</rt></ruby>に<ruby>対する<rt>たいする</rt></ruby>チケンを<ruby>広め<rt>ひろめ</rt></ruby>る。",k:"チケン",a:"知見",m:"実際に見聞きして得た知識"},
{r:"第1・2回",no:4,s:"家族の誰もが、皿を割ったのは弟のシワザだろうと思っている。",sf:"<ruby>家族<rt>かぞく</rt></ruby>の<ruby>誰も<rt>だれも</rt></ruby>が、<ruby>皿<rt>さら</rt></ruby>を<ruby>割っ<rt>わっ</rt></ruby>たのは<ruby>弟<rt>おとうと</rt></ruby>のシワザだろうと<ruby>思って<rt>おもって</rt></ruby>いる。",k:"シワザ",a:"仕業",m:"誰か(多くは良くないこと)がした行い"},
{r:"第1・2回",no:5,s:"翌日提出の宿題があることを思い出し、セッパ詰まって部活を休んだ。",sf:"<ruby>翌日<rt>よくじつ</rt></ruby><ruby>提出<rt>ていしゅつ</rt></ruby>の<ruby>宿題<rt>しゅくだい</rt></ruby>があることを<ruby>思い出し<rt>おもいだし</rt></ruby>、セッパ<ruby>詰ま<rt>つま</rt></ruby>って<ruby>部活<rt>ぶかつ</rt></ruby>を<ruby>休ん<rt>やすん</rt></ruby>だ。",k:"セッパ",a:"切羽",m:"切羽詰まる＝追い詰められてどうにもならなくなること"},
{r:"第1・2回",no:6,s:"彼はガンライ面倒見の良い人なので、手伝ってくれたことは不思議ではない。",sf:"<ruby>彼は<rt>かれは</rt></ruby>ガンライ<ruby>面倒見<rt>めんどうみ</rt></ruby>の<ruby>良い<rt>よい</rt></ruby><ruby>人<rt>ひと</rt></ruby>なので、<ruby>手伝っ<rt>てつだっ</rt></ruby>てくれたことは<ruby>不思議<rt>ふしぎ</rt></ruby>ではない。",k:"ガンライ",a:"元来",m:"もともと、生まれつき"},
{r:"第1・2回",no:7,s:"客船はキテキを鳴らしながら港に近づいた。",sf:"<ruby>客船<rt>きゃくせん</rt></ruby>はキテキを<ruby>鳴ら<rt>なら</rt></ruby>しながら<ruby>港<rt>みなと</rt></ruby>に<ruby>近づ<rt>ちかづ</rt></ruby>いた。",k:"キテキ",a:"汽笛",m:"汽車や船が鳴らす笛の音"},
{r:"第1・2回",no:8,s:"緊張すると、ヘイゼイの彼女からは考えられないほど声が小さくなる。",sf:"<ruby>緊張す<rt>きんちょうす</rt></ruby>ると、ヘイゼイの<ruby>彼女<rt>かのじょ</rt></ruby>からは<ruby>考え<rt>かんがえ</rt></ruby>られないほど<ruby>声<rt>こえ</rt></ruby>が<ruby>小さく<rt>ちいさく</rt></ruby>なる。",k:"ヘイゼイ",a:"平静",m:"落ち着いていて静かなこと"},
{r:"第1・2回",no:9,s:"古代ギリシャの哲学者タレスは「バンブツの根源は水である」と説いた。",sf:"<ruby>古代<rt>こだい</rt></ruby>ギリシャの<ruby>哲学者<rt>てつがくしゃ</rt></ruby>タレスは「バンブツの<ruby>根源<rt>こんげん</rt></ruby>は<ruby>水<rt>みず</rt></ruby>である」と<ruby>説い<rt>とい</rt></ruby>た。",k:"バンブツ",a:"万物",m:"この世に存在するすべてのもの"},
{r:"第1・2回",no:10,s:"内容も見ずに手紙を捨てたのはソウケイだったと反省している。",sf:"<ruby>内容<rt>ないよう</rt></ruby>も<ruby>見ず<rt>みず</rt></ruby>に<ruby>手紙<rt>てがみ</rt></ruby>を<ruby>捨て<rt>すて</rt></ruby>たのはソウケイだったと<ruby>反省<rt>はんせい</rt></ruby>している。",k:"ソウケイ",a:"早計",m:"早まった考え、軽率な判断"},
{r:"第1・2回",no:11,s:"家を出た途端に雨に降られ、デバナをくじかれた気分だ。",sf:"<ruby>家<rt>いえ</rt></ruby>を<ruby>出た<rt>でた</rt></ruby><ruby>途端<rt>とたん</rt></ruby>に<ruby>雨<rt>あめ</rt></ruby>に<ruby>降ら<rt>ふら</rt></ruby>れ、デバナをくじかれた<ruby>気分<rt>きぶん</rt></ruby>だ。",k:"デバナ",a:"出鼻",m:"物事を始めようとする出だし(出鼻をくじく＝出だしの勢いをそがれる)"},
{r:"第1・2回",no:12,s:"彼女からガテンのいく説明を聞くまでは帰れない。",sf:"<ruby>彼女<rt>かのじょ</rt></ruby>からガテンのいく<ruby>説明<rt>せつめい</rt></ruby>を<ruby>聞く<rt>きく</rt></ruby>までは<ruby>帰れ<rt>かえれ</rt></ruby>ない。",k:"ガテン",a:"合点",m:"納得すること、理解して承知すること"},
{r:"第1・2回",no:13,s:"何気なく触れた陶器は百万円もするシロモノだった。",sf:"<ruby>何気な<rt>なにげな</rt></ruby>く<ruby>触れた<rt>ふれた</rt></ruby><ruby>陶器<rt>とうき</rt></ruby>は<ruby>百万円<rt>ひゃくまんえん</rt></ruby>もするシロモノだった。",k:"シロモノ",a:"代物",m:"品物。驚きや皮肉を込めて「そのもの」を指すことも"},
{r:"第1・2回",no:14,s:"彼の発明は、科学の常識を変えるカッキ的なものだった。",sf:"<ruby>彼の<rt>かれの</rt></ruby><ruby>発明<rt>はつめい</rt></ruby>は、<ruby>科学<rt>かがく</rt></ruby>の<ruby>常識<rt>じょうしき</rt></ruby>を<ruby>変え<rt>かえ</rt></ruby>るカッキ<ruby>的な<rt>てきな</rt></ruby>ものだった。",k:"カッキ",a:"画期",m:"新しい時代を開くこと(画期的＝これまでになく新しい)"},
{r:"第1・2回",no:15,s:"彼女はとても上手にシャミセンを弾く。",sf:"<ruby>彼女<rt>かのじょ</rt></ruby>はとても<ruby>上手<rt>じょうず</rt></ruby>にシャミセンを<ruby>弾く<rt>ひく</rt></ruby>。",k:"シャミセン",a:"三味線",m:"日本の伝統的な三本弦の楽器"},
{r:"第1・2回",no:16,s:"彼らはバンドを結成してすぐにトウカクを現し、一躍有名人になった。",sf:"<ruby>彼ら<rt>かれら</rt></ruby>はバンドを<ruby>結成<rt>けっせい</rt></ruby>してすぐにトウカクを<ruby>現し<rt>あらわし</rt></ruby>、<ruby>一躍<rt>いちやく</rt></ruby><ruby>有名人<rt>ゆうめいじん</rt></ruby>になった。",k:"トウカク",a:"頭角",m:"才能や技量が人より目立って優れること(頭角を現す)"},
{r:"第1・2回",no:17,s:"恐ろしい光景を見て、全身にオカンが走った。",sf:"<ruby>恐ろしい<rt>おそろしい</rt></ruby><ruby>光景<rt>こうけい</rt></ruby>を<ruby>見て<rt>みて</rt></ruby>、<ruby>全身<rt>ぜんしん</rt></ruby>にオカンが<ruby>走っ<rt>はしっ</rt></ruby>た。",k:"オカン",a:"悪寒",m:"発熱などで感じるぞくぞくする寒気"},
{r:"第1・2回",no:18,s:"強盗団は、ハクチュウ堂々と宝石店に侵入した。",sf:"<ruby>強盗<rt>ごうとう</rt></ruby><ruby>団<rt>だん</rt></ruby>は、ハクチュウ<ruby>堂々<rt>どうどう</rt></ruby>と<ruby>宝石店<rt>ほうせきてん</rt></ruby>に<ruby>侵入<rt>しんにゅう</rt></ruby>した。",k:"ハクチュウ",a:"白昼",m:"真昼、日中"},
{r:"第1・2回",no:19,s:"自衛隊は、戦後にホッソクした組織である。",sf:"<ruby>自衛隊<rt>じえいたい</rt></ruby>は、<ruby>戦後<rt>せんご</rt></ruby>にホッソクした<ruby>組織<rt>そしき</rt></ruby>である。",k:"ホッソク",a:"発足",m:"組織や活動が新しく始まること"},
{r:"第1・2回",no:20,s:"ナポレオンがタイトウするまでの歴史を学ぶ。",sf:"ナポレオンがタイトウするまでの<ruby>歴史<rt>れきし</rt></ruby>を<ruby>学ぶ<rt>まなぶ</rt></ruby>。",k:"タイトウ",a:"台頭",m:"勢力を増して表に出てくること"},
{r:"第1・2回",no:21,s:"彼のフウテイから、科学者なのだろうと推測する。",sf:"<ruby>彼の<rt>かれの</rt></ruby>フウテイから、<ruby>科学者<rt>かがくしゃ</rt></ruby>なのだろうと<ruby>推測<rt>すいそく</rt></ruby>する。",k:"フウテイ",a:"風体",m:"身なりや外見の様子"},
{r:"第1・2回",no:22,s:"体に異変がある場合には、フクヤクをやめるよう医師に言われた。",sf:"<ruby>体<rt>からだ</rt></ruby>に<ruby>異変<rt>いへん</rt></ruby>がある<ruby>場合<rt>ばあい</rt></ruby>には、フクヤクをやめるよう<ruby>医師<rt>いし</rt></ruby>に<ruby>言わ<rt>いわ</rt></ruby>れた。",k:"フクヤク",a:"服薬",m:"薬を飲むこと"},

// アプリロジック
// ---------------------------------------------------------------
let quizSet = [];
let idx = 0;
let correctCount = 0;
let wrongList = []; // {q, given}
let answered = false;

const startScreen = document.getElementById('startScreen');
const quizScreen = document.getElementById('quizScreen');
const resultScreen = document.getElementById('resultScreen');

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

document.getElementById('startBtn').addEventListener('click', () => {
  const ranges = Array.from(document.querySelectorAll('.rangeChk:checked')).map(c=>c.value);
  if(ranges.length===0){
    alert('出題範囲を1つ以上選んでください。');
    return;
  }
  let pool = QUESTIONS.filter(q => ranges.includes(q.r));
  if(document.getElementById('shuffleChk').checked){
    pool = shuffle(pool);
  }
  const countVal = document.getElementById('countSelect').value;
  if(countVal !== 'all'){
    pool = pool.slice(0, parseInt(countVal,10));
  }
  quizSet = pool;
  idx = 0;
  correctCount = 0;
  wrongList = [];
  startScreen.classList.add('hidden');
  resultScreen.classList.add('hidden');
  quizScreen.classList.remove('hidden');
  renderQuestion();
});

function renderQuestion(){
  answered = false;
  const q = quizSet[idx];
  document.getElementById('qBadge').textContent = q.r + '　問' + q.no;
  document.getElementById('qCounter').textContent = (idx+1) + ' / ' + quizSet.length;
  document.getElementById('qScore').textContent = '正解 ' + correctCount;
  document.getElementById('progressFill').style.width = Math.round((idx/quizSet.length)*100) + '%';

  const highlighted = (q.sf || q.s).replace(q.k, '<span class="blank">' + q.k + '</span>');
  document.getElementById('qSentence').innerHTML = highlighted;

  document.getElementById('hintBox').textContent = '意味：' + (q.m || '');

  const input = document.getElementById('answerInput');
  input.value = '';
  input.disabled = false;
  input.focus();

  const rb = document.getElementById('resultBox');
  rb.className = 'result-box';
  rb.textContent = '';

  document.getElementById('submitBtn').textContent = '答える';
}

function normalize(str){
  return str.trim()
    .replace(/[ 　]/g,'')
    .normalize('NFKC');
}

function checkAnswer(){
  if(answered) { nextQuestion(); return; }
  const q = quizSet[idx];
  const input = document.getElementById('answerInput');
  const given = input.value;
  const norm = normalize(given);
  const accepted = [q.a].concat(q.alts||[]).map(normalize);
  const isCorrect = accepted.includes(norm) && norm.length>0;

  answered = true;
  input.disabled = true;

  const rb = document.getElementById('resultBox');
  const meaningLine = q.m ? ('<div class="meaning-line">意味：' + q.m + '</div>') : '';
  if(isCorrect){
    correctCount++;
    rb.className = 'result-box correct';
    rb.innerHTML = '○ 正解！「' + q.a + '」' + meaningLine;
  } else {
    wrongList.push({q:q, given: given || '（未回答）'});
    rb.className = 'result-box wrong';
    rb.innerHTML = '× 不正解。正解は「' + q.a + '」' + meaningLine;
  }
  document.getElementById('qScore').textContent = '正解 ' + correctCount;
  document.getElementById('submitBtn').textContent = (idx+1 < quizSet.length) ? '次の問題へ' : '結果を見る';
}

function skipQuestion(){
  if(answered){ nextQuestion(); return; }
  const q = quizSet[idx];
  wrongList.push({q:q, given:'（スキップ）'});
  answered = true;
  document.getElementById('answerInput').disabled = true;
  const rb = document.getElementById('resultBox');
  const meaningLine = q.m ? ('<div class="meaning-line">意味：' + q.m + '</div>') : '';
  rb.className = 'result-box wrong';
  rb.innerHTML = '正解は「' + q.a + '」' + meaningLine;
  document.getElementById('submitBtn').textContent = (idx+1 < quizSet.length) ? '次の問題へ' : '結果を見る';
}

function nextQuestion(){
  idx++;
  if(idx >= quizSet.length){
    showResult();
  } else {
    renderQuestion();
  }
}

document.getElementById('submitBtn').addEventListener('click', checkAnswer);
document.getElementById('skipBtn').addEventListener('click', skipQuestion);
document.getElementById('answerInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){
    e.preventDefault();
    checkAnswer();
  }
});

function showResult(){
  quizScreen.classList.add('hidden');
  resultScreen.classList.remove('hidden');
  document.getElementById('finalScore').textContent = correctCount + ' / ' + quizSet.length;
  const pct = quizSet.length ? Math.round(correctCount/quizSet.length*100) : 0;
  document.getElementById('finalPct').textContent = '正答率 ' + pct + '%';

  const list = document.getElementById('reviewList');
  if(wrongList.length===0){
    list.innerHTML = '<p style="text-align:center;color:var(--correct);font-weight:700;">全問正解です！お見事。</p>';
  } else {
    list.innerHTML = '<p class="section-title">間違えた問題（' + wrongList.length + '問）</p>' +
      wrongList.map(w => {
        const sentence = (w.q.sf || w.q.s).replace(w.q.k, '<span class="blank">'+w.q.k+'</span>');
        const meaningLine = w.q.m ? ('<div class="meaning-line">意味：' + w.q.m + '</div>') : '';
        return '<div class="review-item">' +
          '<div class="rs">' + w.q.r + ' 問' + w.q.no + '　' + sentence + '</div>' +
          '<div><span class="ru">' + (w.given || '未回答') + '</span><span class="ra">→ ' + w.q.a + '</span></div>' +
          meaningLine +
          '</div>';
      }).join('');
  }
}

document.getElementById('restartBtn').addEventListener('click', () => {
  resultScreen.classList.add('hidden');
  startScreen.classList.remove('hidden');
});

document.getElementById('retryWrongBtn').addEventListener('click', () => {
  if(wrongList.length===0){
    alert('間違えた問題はありません。');
    return;
  }
  quizSet = wrongList.map(w=>w.q);
  idx = 0;
  correctCount = 0;
  wrongList = [];
  resultScreen.classList.add('hidden');
  quizScreen.classList.remove('hidden');
  renderQuestion();
});
</script>
</body>
</html>
